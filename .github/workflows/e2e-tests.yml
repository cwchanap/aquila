name: E2E Tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  BUN_VERSION: '1.3.1'
  NODE_VERSION: '22'
  PLAYWRIGHT_BROWSERS_PATH: '0'
  TURBO_TELEMETRY_DISABLED: '1'
  CI: 'true'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aquila_e2e

jobs:
  e2e:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aquila_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run release-gate automation unit tests
        # Focused regression for the Vercel bypass credential not leaking to
        # cross-origin R2 requests. Runs before Playwright since it needs no
        # browser; packages/e2e has no `test` script, so use the scoped script.
        working-directory: packages/e2e
        run: bun run test:release-gate-config

      - name: Install Playwright browsers
        working-directory: packages/e2e
        run: bunx playwright install --with-deps

      - name: Run database migrations
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: bun run drizzle:migrate

      - name: Run reading-progress real-Postgres tests
        # Opt-in suite: proves the FOR NO KEY UPDATE merge, compiled-story
        # bookmark writes, scoped story deletion, and the character_setups
        # drop against the migrated job DB. (Production runs the drop only
        # after the new app deploys and the owner authorizes it.)
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          AQUILA_PROGRESS_DB_TEST: '1'
        run: bun run test:run src/lib/drizzle/__tests__/progress-db.test.ts

      - name: Run Playwright tests
        working-directory: packages/e2e
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/e2e/playwright-report/**
          if-no-files-found: warn
          retention-days: 30
