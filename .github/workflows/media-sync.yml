name: Media Sync

# Publishes committed covers and voice to the R2 delivery bucket. Generated
# media is served from the CDN, never from the Vercel bundle, so a merged PR
# that touches these paths is what makes new voice takes go live.
on:
  push:
    branches: ['main']
    paths:
      - 'packages/assets/voice/**'
      - 'packages/assets/media/*/covers/**'
      - 'packages/infra-cloudflare/src/media-sync.ts'
      - '.github/workflows/media-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-sync
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  media-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Upload covers and voice to R2
        env:
          R2_RELEASE_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          R2_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
        run: bun --filter @aquila/infra-cloudflare media:sync
