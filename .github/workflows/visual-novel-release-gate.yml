name: Visual Novel Release Authorization Gate

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run the secretless prepare phase or protected finalize phase.
        required: true
        type: choice
        options:
          - prepare
          - finalize
      candidate_commit_sha:
        description: Exact lowercase 40-character candidate commit SHA.
        required: true
        type: string
      story_id:
        description: Registered visual-novel story ID.
        required: true
        type: string
      preview_id:
        description: Explicit preview namespace ID.
        required: true
        type: string
      release_id:
        description: Immutable production candidate release ID.
        required: true
        type: string
      manifest_sha256:
        description: Expected immutable runtime-manifest SHA-256.
        required: true
        type: string
      publisher_report_run_id:
        description: Run ID that retained the immutable publisher report.
        required: true
        type: string
      publisher_report_artifact:
        description: Artifact name containing the immutable publisher report.
        required: true
        type: string
      asset_base_url:
        description: Public HTTPS visual-asset delivery base URL.
        required: true
        type: string
      web_base_url:
        description: HTTPS allowed-origin policy for the Vercel-returned deployment URL.
        required: true
        type: string
      production_web_origin:
        description: Production HTTPS origin that preview browser checks must not use.
        required: true
        type: string
      scenario_path:
        description: Repository-relative JSON scenario template path.
        required: true
        type: string
      prepare_run_id:
        description: Required only for finalize; successful prepare workflow run ID.
        required: false
        type: string
      manual_review_path:
        description: Required only for finalize; repository-relative approved review JSON.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: visual-novel-release-gate-${{ inputs.phase }}-${{ inputs.candidate_commit_sha }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.1'
  NODE_VERSION: '22'
  VERCEL_CLI_VERSION: '54.17.2'
  PLAYWRIGHT_BROWSERS_PATH: '0'
  TURBO_TELEMETRY_DISABLED: '1'
  CI: 'true'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aquila_e2e

jobs:
  # This is the only job that checks out or executes the candidate. It has no
  # environment, no deployment/R2 credentials, and a contents-only token.
  candidate-build:
    if: ${{ inputs.phase == 'prepare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aquila_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    outputs:
      raw_artifact_id: ${{ steps.raw-artifact.outputs.artifact-id }}
      raw_artifact_digest: ${{ steps.raw-artifact.outputs.artifact-digest }}
    steps:
      - name: Checkout workflow guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup Bun for dispatch validation
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install workflow guard dependencies
        run: bun install --frozen-lockfile

      - name: Validate dispatch inputs
        id: inputs
        env:
          RELEASE_GATE_INPUT_PHASE: ${{ inputs.phase }}
          RELEASE_GATE_INPUT_CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
          RELEASE_GATE_INPUT_STORY_ID: ${{ inputs.story_id }}
          RELEASE_GATE_INPUT_PREVIEW_ID: ${{ inputs.preview_id }}
          RELEASE_GATE_INPUT_RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_GATE_INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          RELEASE_GATE_INPUT_PUBLISHER_REPORT_RUN_ID: ${{ inputs.publisher_report_run_id }}
          RELEASE_GATE_INPUT_PUBLISHER_REPORT_ARTIFACT: ${{ inputs.publisher_report_artifact }}
          RELEASE_GATE_INPUT_ASSET_BASE_URL: ${{ inputs.asset_base_url }}
          RELEASE_GATE_INPUT_WEB_BASE_URL: ${{ inputs.web_base_url }}
          RELEASE_GATE_INPUT_PRODUCTION_WEB_ORIGIN: ${{ inputs.production_web_origin }}
          RELEASE_GATE_INPUT_SCENARIO_PATH: ${{ inputs.scenario_path }}
          RELEASE_GATE_INPUT_PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          RELEASE_GATE_INPUT_MANUAL_REVIEW_PATH: ${{ inputs.manual_review_path }}
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts validate-inputs

      - name: Export validated release-gate identity
        shell: bash
        run: |
          {
            echo "RELEASE_GATE_INPUT_PHASE=${{ steps.inputs.outputs.phase }}"
            echo "RELEASE_GATE_INPUT_CANDIDATE_COMMIT_SHA=${{ steps.inputs.outputs.candidate_commit_sha }}"
            echo "RELEASE_GATE_INPUT_STORY_ID=${{ steps.inputs.outputs.story_id }}"
            echo "RELEASE_GATE_INPUT_PREVIEW_ID=${{ steps.inputs.outputs.preview_id }}"
            echo "RELEASE_GATE_INPUT_RELEASE_ID=${{ steps.inputs.outputs.release_id }}"
            echo "RELEASE_GATE_INPUT_MANIFEST_SHA256=${{ steps.inputs.outputs.manifest_sha256 }}"
            echo "RELEASE_GATE_INPUT_PUBLISHER_REPORT_RUN_ID=${{ steps.inputs.outputs.publisher_report_run_id }}"
            echo "RELEASE_GATE_INPUT_PUBLISHER_REPORT_ARTIFACT=${{ steps.inputs.outputs.publisher_report_artifact }}"
            echo "RELEASE_GATE_INPUT_ASSET_BASE_URL=${{ steps.inputs.outputs.asset_base_url }}"
            echo "RELEASE_GATE_INPUT_WEB_BASE_URL=${{ steps.inputs.outputs.web_base_url }}"
            echo "RELEASE_GATE_INPUT_PRODUCTION_WEB_ORIGIN=${{ steps.inputs.outputs.production_web_origin }}"
            echo "RELEASE_GATE_INPUT_SCENARIO_PATH=${{ steps.inputs.outputs.scenario_path }}"
            echo "RELEASE_GATE_INPUT_PREPARE_RUN_ID=${{ steps.inputs.outputs.prepare_run_id }}"
            echo "RELEASE_GATE_INPUT_MANUAL_REVIEW_PATH=${{ steps.inputs.outputs.manual_review_path }}"
          } >> "$GITHUB_ENV"

      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.inputs.outputs.candidate_commit_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: packages/e2e
        run: bunx playwright install --with-deps

      - name: Run database migrations
        working-directory: apps/web
        run: bun run drizzle:migrate

      - name: Start Tier 1 timing
        shell: bash
        run: echo "RELEASE_GATE_TIER1_STARTED_AT_NANOSECONDS=$(bun --eval 'process.stdout.write(process.hrtime.bigint().toString())')" >> "$GITHUB_ENV"

      - name: Run Tier 1
        run: bun run verify:visual-novel-ci -- --evidence .release-gate/evidence/tier1.json

      - name: Record Tier 1 timing
        if: ${{ always() }}
        continue-on-error: true
        env:
          RELEASE_GATE_STAGE_NAME: tier1
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts record-stage-timing

      # No vercel pull occurs here: the build uses only public preview values,
      # and candidate source never receives a deployment token or linked project.
      - name: Build credential-free candidate output
        env:
          PUBLIC_ASSET_BASE_URL: ${{ steps.inputs.outputs.asset_base_url }}
          PUBLIC_ASSET_ENVIRONMENT: preview
          PUBLIC_ASSET_PREVIEW_ID: ${{ steps.inputs.outputs.preview_id }}
          VERCEL_ENV: preview
        run: bun --filter web build

      - name: Package raw candidate output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-gate/candidate-raw/vercel-output
          cp -R apps/web/.vercel/output/. .release-gate/candidate-raw/vercel-output/
          cp .release-gate/evidence/tier1.json .release-gate/candidate-raw/tier1.json
          cp "$RELEASE_GATE_INPUT_SCENARIO_PATH" .release-gate/candidate-raw/scenario-template.json
          cp bun.lock .release-gate/candidate-raw/candidate-lockfile
          tar --format=ustar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C .release-gate/candidate-raw \
            -cf ../candidate-output.v1.tar \
            tier1.json scenario-template.json candidate-lockfile vercel-output

      - name: Upload raw candidate output
        id: raw-artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-novel-raw-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-gate/candidate-output.v1.tar
          if-no-files-found: warn
          retention-days: 2
          overwrite: false

  # This job runs the workflow SHA on main. It treats the candidate artifact as
  # hostile bytes, checks a trusted copy of the candidate lockfile, and emits
  # only a canonical contract, canonical Tier 1 JSON, and canonical USTAR output.
  seal-candidate:
    if: ${{ inputs.phase == 'prepare' }}
    needs: candidate-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      sealed_artifact_id: ${{ steps.sealed-artifact.outputs.artifact-id }}
      sealed_artifact_digest: ${{ steps.sealed-artifact.outputs.artifact-digest }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Validate dispatch inputs
        id: inputs
        env:
          RELEASE_GATE_INPUT_PHASE: ${{ inputs.phase }}
          RELEASE_GATE_INPUT_CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
          RELEASE_GATE_INPUT_STORY_ID: ${{ inputs.story_id }}
          RELEASE_GATE_INPUT_PREVIEW_ID: ${{ inputs.preview_id }}
          RELEASE_GATE_INPUT_RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_GATE_INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          RELEASE_GATE_INPUT_PUBLISHER_REPORT_RUN_ID: ${{ inputs.publisher_report_run_id }}
          RELEASE_GATE_INPUT_PUBLISHER_REPORT_ARTIFACT: ${{ inputs.publisher_report_artifact }}
          RELEASE_GATE_INPUT_ASSET_BASE_URL: ${{ inputs.asset_base_url }}
          RELEASE_GATE_INPUT_WEB_BASE_URL: ${{ inputs.web_base_url }}
          RELEASE_GATE_INPUT_PRODUCTION_WEB_ORIGIN: ${{ inputs.production_web_origin }}
          RELEASE_GATE_INPUT_SCENARIO_PATH: ${{ inputs.scenario_path }}
          RELEASE_GATE_INPUT_PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          RELEASE_GATE_INPUT_MANUAL_REVIEW_PATH: ${{ inputs.manual_review_path }}
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts validate-inputs

      - name: Export validated release-gate identity
        shell: bash
        run: |
          {
            echo "RELEASE_GATE_INPUT_PHASE=${{ steps.inputs.outputs.phase }}"
            echo "RELEASE_GATE_INPUT_CANDIDATE_COMMIT_SHA=${{ steps.inputs.outputs.candidate_commit_sha }}"
            echo "RELEASE_GATE_INPUT_STORY_ID=${{ steps.inputs.outputs.story_id }}"
            echo "RELEASE_GATE_INPUT_PREVIEW_ID=${{ steps.inputs.outputs.preview_id }}"
            echo "RELEASE_GATE_INPUT_RELEASE_ID=${{ steps.inputs.outputs.release_id }}"
            echo "RELEASE_GATE_INPUT_MANIFEST_SHA256=${{ steps.inputs.outputs.manifest_sha256 }}"
            echo "RELEASE_GATE_INPUT_PUBLISHER_REPORT_RUN_ID=${{ steps.inputs.outputs.publisher_report_run_id }}"
            echo "RELEASE_GATE_INPUT_PUBLISHER_REPORT_ARTIFACT=${{ steps.inputs.outputs.publisher_report_artifact }}"
            echo "RELEASE_GATE_INPUT_ASSET_BASE_URL=${{ steps.inputs.outputs.asset_base_url }}"
            echo "RELEASE_GATE_INPUT_WEB_BASE_URL=${{ steps.inputs.outputs.web_base_url }}"
            echo "RELEASE_GATE_INPUT_PRODUCTION_WEB_ORIGIN=${{ steps.inputs.outputs.production_web_origin }}"
            echo "RELEASE_GATE_INPUT_SCENARIO_PATH=${{ steps.inputs.outputs.scenario_path }}"
          } >> "$GITHUB_ENV"

      - name: Validate trusted workflow context
        env:
          RELEASE_GATE_EXPECTED_TRUSTED_JOB: seal-candidate
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts validate-trusted-workflow-context

      - name: Download exact raw candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.candidate-build.outputs.raw_artifact_id }}
          path: ${{ runner.temp }}/release-gate-raw-candidate

      - name: Fetch trusted candidate lockfile bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-gate-trusted-candidate"
          git fetch --no-tags --depth=1 origin "$RELEASE_GATE_INPUT_CANDIDATE_COMMIT_SHA"
          git show FETCH_HEAD:bun.lock > "$RUNNER_TEMP/release-gate-trusted-candidate/candidate-lockfile"

      - name: Safely extract raw candidate output
        env:
          RELEASE_GATE_RAW_CANDIDATE_ROOT: ${{ runner.temp }}/release-gate-raw-candidate
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts inspect-raw-candidate-artifact

      - name: Seal candidate output
        env:
          RELEASE_GATE_RAW_CANDIDATE_ROOT: ${{ runner.temp }}/release-gate-raw-candidate
          RELEASE_GATE_TRUSTED_CANDIDATE_INPUT_ROOT: ${{ runner.temp }}/release-gate-trusted-candidate
          RELEASE_GATE_RAW_CANDIDATE_ARTIFACT_ID: ${{ needs.candidate-build.outputs.raw_artifact_id }}
          RELEASE_GATE_RAW_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.candidate-build.outputs.raw_artifact_digest }}
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts seal-candidate-artifact

      - name: Upload sealed candidate artifact
        id: sealed-artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-novel-sealed-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release-gate/sealed-candidate/candidate-build-contract.v1.json
            .release-gate/sealed-candidate/tier1.json
            .release-gate/sealed-candidate/vercel-output.v1.tar
          if-no-files-found: warn
          retention-days: 30
          overwrite: false

      - name: Attest sealed candidate artifact
        if: ${{ success() }}
        uses: actions/attest@v4
        with:
          subject-path: .release-gate/sealed-candidate
          subject-name: visual-novel-sealed-candidate

  prepare-live:
    if: ${{ inputs.phase == 'prepare' }}
    needs: seal-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: visual-novel-release-preview
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aquila_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Validate dispatch inputs
        id: inputs
        env:
          RELEASE_GATE_INPUT_PHASE: ${{ inputs.phase }}
          RELEASE_GATE_INPUT_CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
          RELEASE_GATE_INPUT_STORY_ID: ${{ inputs.story_id }}
          RELEASE_GATE_INPUT_PREVIEW_ID: ${{ inputs.preview_id }}
          RELEASE_GATE_INPUT_RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_GATE_INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          RELEASE_GATE_INPUT_PUBLISHER_REPORT_RUN_ID: ${{ inputs.publisher_report_run_id }}
          RELEASE_GATE_INPUT_PUBLISHER_REPORT_ARTIFACT: ${{ inputs.publisher_report_artifact }}
          RELEASE_GATE_INPUT_ASSET_BASE_URL: ${{ inputs.asset_base_url }}
          RELEASE_GATE_INPUT_WEB_BASE_URL: ${{ inputs.web_base_url }}
          RELEASE_GATE_INPUT_PRODUCTION_WEB_ORIGIN: ${{ inputs.production_web_origin }}
          RELEASE_GATE_INPUT_SCENARIO_PATH: ${{ inputs.scenario_path }}
          RELEASE_GATE_INPUT_PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          RELEASE_GATE_INPUT_MANUAL_REVIEW_PATH: ${{ inputs.manual_review_path }}
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts validate-inputs

      - name: Export validated release-gate identity
        shell: bash
        run: |
          {
            echo "RELEASE_GATE_INPUT_PHASE=${{ steps.inputs.outputs.phase }}"
            echo "RELEASE_GATE_INPUT_CANDIDATE_COMMIT_SHA=${{ steps.inputs.outputs.candidate_commit_sha }}"
            echo "RELEASE_GATE_INPUT_STORY_ID=${{ steps.inputs.outputs.story_id }}"
            echo "RELEASE_GATE_INPUT_PREVIEW_ID=${{ steps.inputs.outputs.preview_id }}"
            echo "RELEASE_GATE_INPUT_RELEASE_ID=${{ steps.inputs.outputs.release_id }}"
            echo "RELEASE_GATE_INPUT_MANIFEST_SHA256=${{ steps.inputs.outputs.manifest_sha256 }}"
            echo "RELEASE_GATE_INPUT_PUBLISHER_REPORT_RUN_ID=${{ steps.inputs.outputs.publisher_report_run_id }}"
            echo "RELEASE_GATE_INPUT_PUBLISHER_REPORT_ARTIFACT=${{ steps.inputs.outputs.publisher_report_artifact }}"
            echo "RELEASE_GATE_INPUT_ASSET_BASE_URL=${{ steps.inputs.outputs.asset_base_url }}"
            echo "RELEASE_GATE_INPUT_WEB_BASE_URL=${{ steps.inputs.outputs.web_base_url }}"
            echo "RELEASE_GATE_INPUT_PRODUCTION_WEB_ORIGIN=${{ steps.inputs.outputs.production_web_origin }}"
            echo "RELEASE_GATE_INPUT_SCENARIO_PATH=${{ steps.inputs.outputs.scenario_path }}"
          } >> "$GITHUB_ENV"

      - name: Start live timing
        shell: bash
        run: echo "RELEASE_GATE_LIVE_STARTED_AT_NANOSECONDS=$(bun --eval 'process.stdout.write(process.hrtime.bigint().toString())')" >> "$GITHUB_ENV"

      - name: Validate trusted workflow context
        env:
          RELEASE_GATE_EXPECTED_TRUSTED_JOB: prepare-live
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts validate-trusted-workflow-context

      - name: Install Playwright browsers
        working-directory: packages/e2e
        run: bunx playwright install --with-deps

      - name: Run database migrations
        working-directory: apps/web
        run: bun run drizzle:migrate

      - name: Validate credential-free preview project configuration
        env:
          VERCEL_TOKEN: ${{ secrets.RELEASE_GATE_VERCEL_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.RELEASE_GATE_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.RELEASE_GATE_VERCEL_PREVIEW_PROJECT_ID }}
          RELEASE_GATE_VERCEL_PREVIEW_CREDENTIAL_FREE: ${{ vars.RELEASE_GATE_VERCEL_PREVIEW_CREDENTIAL_FREE }}
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts validate-vercel-preview-contract

      # Pull links the trusted preview project before any candidate bytes are
      # extracted. The helper then rejects/removes any output and creates a
      # fresh readonly output directory from the sealed archive.
      - name: Link trusted Vercel preview project
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.RELEASE_GATE_VERCEL_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.RELEASE_GATE_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.RELEASE_GATE_VERCEL_PREVIEW_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-gate-vercel"
          bunx --bun "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=preview \
            > "$RUNNER_TEMP/release-gate-vercel/pull.stdout" \
            2> "$RUNNER_TEMP/release-gate-vercel/pull.stderr"

      - name: Download exact sealed candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.seal-candidate.outputs.sealed_artifact_id }}
          path: ${{ runner.temp }}/release-gate-sealed-candidate

      - name: Safely extract sealed candidate output
        env:
          RELEASE_GATE_SEALED_ARTIFACT_ROOT: ${{ runner.temp }}/release-gate-sealed-candidate
          RELEASE_GATE_SEALED_ARTIFACT_ID: ${{ needs.seal-candidate.outputs.sealed_artifact_id }}
          RELEASE_GATE_SEALED_ARTIFACT_DIGEST: ${{ needs.seal-candidate.outputs.sealed_artifact_digest }}
          RELEASE_GATE_SEALED_PRODUCER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_GATE_SEALED_PRODUCER_RUN_ID: ${{ github.run_id }}
          RELEASE_GATE_SEALED_PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts ingest-sealed-candidate-artifact

      - name: Rehash sealed output immediately before deploy
        env:
          RELEASE_GATE_SEALED_ARTIFACT_ROOT: ${{ runner.temp }}/release-gate-sealed-candidate
          RELEASE_GATE_OUTPUT_CHECK_PHASE: predeploy
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts verify-sealed-output

      - name: Start prebuilt deployment timing
        shell: bash
        run: echo "RELEASE_GATE_PREBUILT_STARTED_AT_NANOSECONDS=$(bun --eval 'process.stdout.write(process.hrtime.bigint().toString())')" >> "$GITHUB_ENV"

      - name: Deploy the sealed prebuilt output
        id: deploy-preview
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.RELEASE_GATE_VERCEL_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.RELEASE_GATE_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.RELEASE_GATE_VERCEL_PREVIEW_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          vercel() {
            bunx --bun "vercel@${VERCEL_CLI_VERSION}" "$@"
          }
          vercel deploy --prebuilt --yes \
            --meta "aquilaCandidateCommit=$RELEASE_GATE_INPUT_CANDIDATE_COMMIT_SHA" \
            > "$RUNNER_TEMP/release-gate-vercel/deploy.stdout" \
            2> "$RUNNER_TEMP/release-gate-vercel/deploy.stderr"

      - name: Attest prebuilt deployment binding
        id: deployment-attestation
        env:
          RELEASE_GATE_VERCEL_STDOUT_ROOT: ${{ runner.temp }}/release-gate-vercel
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts attest-deployment

      - name: Rehash sealed output immediately after deploy
        env:
          RELEASE_GATE_SEALED_ARTIFACT_ROOT: ${{ runner.temp }}/release-gate-sealed-candidate
          RELEASE_GATE_OUTPUT_CHECK_PHASE: postdeploy
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts verify-sealed-output

      - name: Record prebuilt deployment timing
        if: ${{ always() }}
        continue-on-error: true
        env:
          RELEASE_GATE_STAGE_NAME: prebuilt-deployment
        run: bun packages/infra-cloudflare/scripts/release-gate-workflow-evidence.ts record-stage-timing

