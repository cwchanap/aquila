name: Visual Release

# Publishes a story's backgrounds and portraits, or its sound effects and
# music, to the R2 delivery bucket and makes that release live. Generated media
# is served from the CDN, never from the Vercel bundle, so merging an art or
# sound PR to main is what puts it in the reader. Run it by hand to go live
# before a merge (Vercel previews read the production release too) or to roll
# back. Art and sound are two separate releases of the same story.
#
# The Seventh Mirror is left out: it follows the per-environment preview
# pointers and goes through the Visual Novel Release Gate instead.
on:
  push:
    branches: ['main']
    paths:
      - 'packages/assets/media/*/backgrounds/**'
      - 'packages/assets/media/*/characters/**'
      - '!packages/assets/media/*/backgrounds/_reference/**'
      - 'packages/assets/media/*/sfx/**'
      - 'packages/assets/media/*/bgm/**'
  workflow_dispatch:
    inputs:
      media:
        description: Which release to publish or roll back
        type: choice
        options: [visual, audio]
        default: visual
      action:
        description: publish releases the art or sound on the selected branch; rollback returns to an earlier release
        type: choice
        options: [publish, rollback]
        default: publish
      story:
        description: Story id, e.g. train_adventure
        type: string
        required: true
      release_id:
        description: Rollback only. Release id to return to (sha256-<64 hex>), shown in an earlier run's summary
        type: string
        required: false

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.1'
  TURBO_TELEMETRY_DISABLED: '1'
  # Public origin of the R2 delivery host, not a secret.
  ASSET_BASE_URL: https://assets.aquila.cwchanap.dev

jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      releases: ${{ steps.pick.outputs.releases }}
    steps:
      # A push can carry many commits (Rebase and merge) and many files, so
      # diff the commit before the push against the pushed one with git. Trees
      # only, so no image is downloaded, and unlike the compare API there is
      # no cap on the number of files.
      - name: Fetch the pushed commits (trees only)
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: .github
          fetch-depth: 1

      - name: Pick the releases to publish
        id: pick
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_STORY: ${{ inputs.story }}
          INPUT_MEDIA: ${{ inputs.media }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_STORY" == "the_seventh_mirror" ]]; then
              echo 'The Seventh Mirror goes through the Visual Novel Release Gate, not this workflow' >&2
              exit 1
            fi
            echo "releases=$(jq -cn --arg story "$INPUT_STORY" --arg media "$INPUT_MEDIA" '[{story: $story, media: $media}]')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 --filter=blob:none origin "$BEFORE_SHA"
          # --no-renames lists both the old and the new path of a moved file.
          changed=$(git diff --no-renames --name-only "$BEFORE_SHA" "$HEAD_SHA" -- packages/assets/media)
          art=$(printf '%s\n' "$changed" \
            | grep -v '/backgrounds/_reference/' \
            | sed -nE 's#^packages/assets/media/([^/]+)/(backgrounds|characters)/.*#\1#p' \
            | sort -u \
            | grep -vx the_seventh_mirror || true)
          sound=$(printf '%s\n' "$changed" \
            | sed -nE 's#^packages/assets/media/([^/]+)/(sfx|bgm)/.*#\1#p' \
            | sort -u \
            | grep -vx the_seventh_mirror || true)
          echo "Stories with changed art: ${art:-none}"
          echo "Stories with changed sound: ${sound:-none}"
          releases=$(jq -cn --arg art "$art" --arg sound "$sound" '
            ($art | split("\n") | map(select(length > 0) | {story: ., media: "visual"}))
            + ($sound | split("\n") | map(select(length > 0) | {story: ., media: "audio"}))')
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  release:
    needs: stories
    if: needs.stories.outputs.releases != '[]'
    name: release ${{ matrix.release.media }} ${{ matrix.release.story }}
    runs-on: ubuntu-latest
    # Encoding takes 5 to 8 seconds per image on four cores, so a full
    # train_adventure art release is 15 to 25 minutes. A sound release is a few
    # dozen short files and takes a couple of minutes.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.stories.outputs.releases) }}
    # One run per story and release kind at a time. A queued run is only
    # replaced by a newer run for the same story and kind, and that run
    # publishes all of main's art (or sound).
    concurrency:
      group: visual-release-${{ matrix.release.story }}-${{ matrix.release.media }}
      cancel-in-progress: false
    env:
      STORY: ${{ matrix.release.story }}
      MEDIA: ${{ matrix.release.media }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A merge publishes the tip of main, not the pushed commit: re-running
          # an old run after a newer release must not bring older art back.
          # A manual run publishes the branch it was started on.
          ref: ${{ github.event_name == 'push' && 'refs/heads/main' || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The sound encoder needs ffmpeg and ffprobe.
      - name: Install ffmpeg
        if: env.MEDIA == 'audio'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Publish and activate
        if: inputs.action != 'rollback' && env.MEDIA == 'visual'
        shell: bash
        env:
          R2_RELEASE_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          R2_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p .tmp
          bun packages/infra-cloudflare/src/publisher/cli.ts publish \
            --story "$STORY" \
            --environment production \
            --source-root packages/assets/media \
            --destination r2 \
            --confirm-production "$STORY" \
            --json > .tmp/report.json
          jq -r .manifestSha256 .tmp/report.json > .tmp/manifest-sha256

      # Sound publishes, is checked on the CDN, then goes live; the report keeps
      # the publish counts and warnings (cues that have no sound file yet).
      - name: Publish and activate sound
        if: inputs.action != 'rollback' && env.MEDIA == 'audio'
        shell: bash
        env:
          R2_RELEASE_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          R2_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p .tmp
          config=$(grep -lF "storyId: '$STORY'" packages/stories/raw/*/compiler.config.ts | head -n 1 || true)
          if [[ -z "$config" ]]; then
            echo "No raw story folder has storyId $STORY" >&2
            exit 1
          fi
          folder=$(basename "$(dirname "$config")")
          cli=packages/infra-cloudflare/src/publisher/cli.ts
          bun "$cli" publish \
            --media audio \
            --story "$STORY" \
            --story-folder "$folder" \
            --environment production \
            --source-root packages/assets/media \
            --destination r2 \
            --json > .tmp/publish.json
          # Keep the publish report for the summary even if a later step fails.
          cp .tmp/publish.json .tmp/report.json
          release=$(jq -r .releaseId .tmp/publish.json)
          sha=$(jq -r .manifestSha256 .tmp/publish.json)
          # Check the CDN serves the new release before anything points at it.
          bun packages/infra-cloudflare/src/verify.ts \
            --media audio \
            --story "$STORY" \
            --environment production \
            --release "$release" \
            --expect-manifest-sha256 "$sha" \
            --asset-base-url "$ASSET_BASE_URL"
          bun "$cli" activate \
            --media audio \
            --story "$STORY" \
            --environment production \
            --release "$release" \
            --expect-manifest-sha256 "$sha" \
            --confirm-production "$STORY" \
            --destination r2 \
            --json > .tmp/activate.json
          jq -s '.[0] + {counts: .[1].counts, warnings: .[1].warnings}' \
            .tmp/activate.json .tmp/publish.json > .tmp/report.json
          echo "$sha" > .tmp/manifest-sha256

      - name: Roll back
        if: inputs.action == 'rollback'
        shell: bash
        env:
          R2_RELEASE_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          R2_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          mkdir -p .tmp
          if [[ -z "$RELEASE_ID" ]]; then
            echo 'release_id is required to roll back' >&2
            exit 1
          fi
          bun packages/infra-cloudflare/src/publisher/cli.ts releases \
            --media "$MEDIA" \
            --story "$STORY" \
            --environment production \
            --destination r2 \
            --json > .tmp/releases.json
          jq -r --arg id "$RELEASE_ID" \
            '.releases[] | select(.releaseId == $id) | .manifestSha256 // empty' \
            .tmp/releases.json > .tmp/manifest-sha256
          if [[ ! -s .tmp/manifest-sha256 ]]; then
            echo "No stored release $RELEASE_ID for $STORY" >&2
            exit 1
          fi
          bun packages/infra-cloudflare/src/publisher/cli.ts rollback \
            --media "$MEDIA" \
            --story "$STORY" \
            --environment production \
            --release "$RELEASE_ID" \
            --expect-manifest-sha256 "$(cat .tmp/manifest-sha256)" \
            --confirm-production "$STORY" \
            --destination r2 \
            --json > .tmp/report.json

      - name: Verify the CDN serves the live release
        shell: bash
        run: |
          bun packages/infra-cloudflare/src/verify.ts \
            --media "$MEDIA" \
            --story "$STORY" \
            --environment production \
            --expect-manifest-sha256 "$(cat .tmp/manifest-sha256)" \
            --asset-base-url "$ASSET_BASE_URL"

      - name: Summarize the release
        if: always()
        shell: bash
        run: |
          if [[ ! -f .tmp/report.json ]]; then
            echo "### $STORY: no report, see the failed step above" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r --arg commit "$(git rev-parse --short HEAD)" '
            "### \(.storyId) \(.media // "visual"): \(.command) \(.status)",
            "",
            "| | |",
            "|---|---|",
            (if .command == "publish" then "| Built from commit | `\($commit)` |" else empty end),
            "| Release in this run | `\(.releaseId // "none")` |",
            "| Live release | `\(.pointer.afterReleaseId // "unknown")` |",
            "| Manifest sha256 | `\(.manifestSha256 // "none")` |",
            "| Live before | `\(.pointer.beforeReleaseId // "none")` |",
            "| Objects created / reused | \(.counts.objectsCreated // 0) / \(.counts.objectsReused // 0) |",
            (if (.warnings // []) | length > 0 then
              "",
              "Warnings:",
              (.warnings[] | "- \(.code): \(.message)\(if .count then " (\(.count): \((.sampleIdentities // []) | join(", ")))" else "" end)")
            else empty end)
          ' .tmp/report.json >> "$GITHUB_STEP_SUMMARY"
          before=$(jq -r '.pointer.beforeReleaseId // empty' .tmp/report.json)
          if [[ -n "$before" && "$(jq -r '.pointer.changed // false' .tmp/report.json)" == "true" ]]; then
            {
              echo
              echo "To undo, run this workflow with action \`rollback\`, media \`$MEDIA\`, story \`$STORY\` and release id \`$before\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
