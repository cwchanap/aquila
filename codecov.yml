codecov:
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

comment:
  after_n_builds: 2

coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 95%
        threshold: 0%
        informational: false

ignore:
  - "apps/web/scripts/assert-story-chunks.ts"
  - "apps/web/scripts/measure-reader-bundles.ts"
