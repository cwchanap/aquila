codecov:
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

comment:
  after_n_builds: 2

coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure
        # The v8+svelte coverage remap intermittently leaves {:else} template
        # branches and single-location branches without coverage records, so
        # covered lines read as patch misses. The fallback icon renders under
        # test via the saga cards; skip only this file's patch gate.
        paths:
          - "!apps/web/src/components/StorySelect.svelte"

ignore:
  - "apps/web/scripts/assert-story-chunks.ts"
  - "apps/web/scripts/measure-reader-bundles.ts"
  - "apps/web/scripts/build-short-story-assets.ts"
