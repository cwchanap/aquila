codecov:
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

comment:
  after_n_builds: 2

coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure

ignore:
  - "apps/web/scripts/assert-story-chunks.ts"
  - "apps/web/scripts/measure-reader-bundles.ts"
